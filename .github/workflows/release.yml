name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 3.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Error: Version must be in format X.Y.Z (e.g., 3.2.0)"
            exit 1
          fi
          echo "✓ Version format is valid: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if tag already exists
        run: |
          VERSION="${{ env.VERSION }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "❌ Error: Tag v$VERSION already exists"
            exit 1
          fi
          echo "✓ Tag v$VERSION does not exist yet"

      - name: Update version in app.js
        run: |
          VERSION="${{ env.VERSION }}"
          sed -i "s/const APP_VERSION = '[0-9.]*';/const APP_VERSION = '$VERSION';/" app.js
          echo "✓ Updated app.js version to $VERSION"

      - name: Update version in service-worker.js
        run: |
          VERSION="${{ env.VERSION }}"
          sed -i "s/const APP_VERSION = '[0-9.]*';/const APP_VERSION = '$VERSION';/" service-worker.js
          echo "✓ Updated service-worker.js version to $VERSION"

      - name: Verify version updates
        run: |
          VERSION="${{ env.VERSION }}"
          APP_VERSION=$(grep "const APP_VERSION = " app.js | sed -n "s/.*'\([0-9.]*\)'.*/\1/p")
          SW_VERSION=$(grep "const APP_VERSION = " service-worker.js | sed -n "s/.*'\([0-9.]*\)'.*/\1/p")
          
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "❌ Error: app.js version ($APP_VERSION) does not match expected ($VERSION)"
            exit 1
          fi
          
          if [ "$SW_VERSION" != "$VERSION" ]; then
            echo "❌ Error: service-worker.js version ($SW_VERSION) does not match expected ($VERSION)"
            exit 1
          fi
          
          echo "✓ Both files updated successfully to version $VERSION"
          echo "  app.js: $APP_VERSION"
          echo "  service-worker.js: $SW_VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version changes
        run: |
          VERSION="${{ env.VERSION }}"
          git add app.js service-worker.js
          git commit -m "Bump version to $VERSION to refresh PWA cache"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "✓ Committed version changes"

      - name: Push changes to main
        run: |
          git push origin HEAD:main
          echo "✓ Pushed version changes to main branch"

      - name: Create and push tag
        run: |
          VERSION="${{ env.VERSION }}"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"
          echo "✓ Created and pushed tag v$VERSION"

      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.VERSION;
            
            // Get all tags
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Find the previous tag (if any)
            const currentTagIndex = tags.findIndex(tag => tag.name === `v${version}`);
            const previousTag = currentTagIndex < tags.length - 1 ? tags[currentTagIndex + 1] : null;
            
            // Get commits between previous tag and current tag
            let commits;
            if (previousTag) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: previousTag.name,
                head: `v${version}`
              });
              commits = comparison.data.commits;
            } else {
              // If no previous tag, get all commits up to this one
              const response = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: `v${version}`,
                per_page: 100
              });
              commits = response.data;
            }
            
            // Format release notes
            let releaseNotes = `## What's Changed\n\n`;
            
            if (commits.length > 1) {
              // Filter out the version bump commit itself
              const filteredCommits = commits.filter(commit => 
                !commit.commit.message.startsWith('Bump version to')
              );
              
              if (filteredCommits.length > 0) {
                filteredCommits.forEach(commit => {
                  const message = commit.commit.message.split('\n')[0];
                  const author = commit.author ? commit.author.login : commit.commit.author.name;
                  releaseNotes += `* ${message} by @${author}\n`;
                });
              } else {
                releaseNotes += `* Version bump to ${version} to refresh PWA cache\n`;
              }
            } else {
              releaseNotes += `* Version bump to ${version} to refresh PWA cache\n`;
            }
            
            if (previousTag) {
              releaseNotes += `\n**Full Changelog**: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${previousTag.name}...v${version}`;
            } else {
              releaseNotes += `\n**Full Changelog**: https://github.com/${context.repo.owner}/${context.repo.repo}/commits/v${version}`;
            }
            
            core.setOutput('notes', releaseNotes);
            return releaseNotes;

      - name: Create GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        with:
          script: |
            const version = process.env.VERSION;
            const releaseNotes = process.env.RELEASE_NOTES;
            
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });
            
            console.log(`✓ Created release: ${release.html_url}`);
            core.summary
              .addHeading(`🎉 Release v${version} Created!`)
              .addLink('View Release', release.html_url)
              .addRaw('\n\n')
              .addRaw(releaseNotes)
              .write();
